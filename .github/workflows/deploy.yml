# UniTutor Worker → Pages → Cloudflare.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Manual: gh workflow run deploy.yml
# D1 migrations: backend `npm run deploy` applies DB --remote before wrangler deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # pages deploy does not create projects in non-interactive CI (8000007).
      - name: Ensure Pages project
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler pages project list | grep -qE '(^|[[:space:]])unitutor([[:space:]]|$)'; then
            echo "Pages project unitutor already exists"
          else
            npx wrangler pages project create unitutor --production-branch=main
          fi

      - name: Deploy Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: https://api.tutor.askwho.net
        run: npm run deploy:pages

      # wrangler has no pages domain CLI; API attach + explicit zone CNAME (attach alone ≠ public DNS).
      # List match must be JSON-aware (pretty "name": "x" breaks grep -F '"name":"x"').
      # POST 400 already-exists is success when Dashboard/prior run attached first.
      - name: Ensure Pages custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          TOKEN="${CLOUDFLARE_API_TOKEN}"
          PROJECT=unitutor
          DOMAIN=unitutor.askwho.net
          ZONE_NAME=askwho.net
          PAGES_DEV=unitutor.pages.dev
          BASE="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains"
          list_json=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "${BASE}")
          if printf '%s' "${list_json}" | python3 deploy/pages_domain_attached.py check "${DOMAIN}"; then
            echo "Pages domain ${DOMAIN} already attached"
          else
            echo "Attaching Pages domain ${DOMAIN}"
            code=$(curl -sS -o /tmp/cf-domain-attach.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              "${BASE}" \
              -d "{\"name\":\"${DOMAIN}\"}")
            body=$(cat /tmp/cf-domain-attach.json || true)
            echo "attach HTTP ${code}: ${body}"
            if printf '%s' "${body}" | python3 deploy/pages_domain_attached.py attach-ok "${code}"; then
              echo "Pages domain ${DOMAIN} attach ok (or already present)"
            else
              echo "Domain attach failed HTTP ${code}" >&2
              exit 1
            fi
            list_json=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "${BASE}")
          fi
          status=$(printf '%s' "${list_json}" | python3 deploy/pages_domain_dns.py status "${DOMAIN}" || true)
          echo "Pages domain ${DOMAIN} status=${status:-unknown}"
          zones_code=$(curl -sS -o /tmp/cf-zones.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")
          if [ "${zones_code}" != "200" ]; then
            echo "Zone lookup HTTP ${zones_code}: $(cat /tmp/cf-zones.json)" >&2
            echo "Token needs Zone Read (askwho.net) or use Dashboard Custom domains + DNS." >&2
            exit 1
          fi
          zone_id=$(python3 deploy/pages_domain_dns.py zone-id < /tmp/cf-zones.json) || {
            echo "Zone ${ZONE_NAME} not found in this account — Dashboard DNS required." >&2
            exit 1
          }
          echo "Zone ${ZONE_NAME} id=${zone_id}"
          dns_code=$(curl -sS -o /tmp/cf-dns-list.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${DOMAIN}")
          if python3 deploy/pages_domain_dns.py dns-list-ok "${dns_code}"; then
            if python3 deploy/pages_domain_dns.py has-record "${DOMAIN}" < /tmp/cf-dns-list.json; then
              echo "DNS record for ${DOMAIN} already present"
            else
              echo "Creating proxied CNAME ${DOMAIN} → ${PAGES_DEV}"
              create_code=$(curl -sS -o /tmp/cf-dns-create.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
                -d "{\"type\":\"CNAME\",\"name\":\"${DOMAIN}\",\"content\":\"${PAGES_DEV}\",\"ttl\":1,\"proxied\":true}")
              create_body=$(cat /tmp/cf-dns-create.json || true)
              echo "DNS create HTTP ${create_code}: ${create_body}"
              if printf '%s' "${create_body}" | python3 deploy/pages_domain_dns.py dns-ok "${create_code}"; then
                echo "DNS CNAME for ${DOMAIN} ok"
              else
                echo "DNS create failed — grant Zone DNS Edit or add CNAME in Dashboard." >&2
                exit 1
              fi
            fi
          elif python3 deploy/pages_domain_dns.py dns-list-soft-skip "${dns_code}"; then
            echo "DNS list HTTP ${dns_code}: $(cat /tmp/cf-dns-list.json)" >&2
            echo "Skipping DNS ensure — token lacks Zone DNS Read/Edit; Dashboard must own CNAME ${DOMAIN} → ${PAGES_DEV}." >&2
          else
            echo "DNS list HTTP ${dns_code}: $(cat /tmp/cf-dns-list.json)" >&2
            echo "Token needs Zone DNS Read/Edit or use Dashboard." >&2
            exit 1
          fi

      - name: Smoke
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-all-errors --retry-delay 3 \
            https://api.tutor.askwho.net/health
          # Custom domain may need a short DNS/TLS settle after first attach.
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 \
            -o /dev/null https://unitutor.askwho.net/
